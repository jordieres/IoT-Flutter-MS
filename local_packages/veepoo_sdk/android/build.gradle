plugins {
    id 'com.android.library'
}

group = 'vn.com.tma.ehealth.veepoo_sdk'
version = '1.0'

android {
    namespace 'vn.com.tma.ehealth.veepoo_sdk'
    compileSdk = 35

    defaultConfig {
        minSdk = 22
        targetSdk = 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        consumerProguardFiles "consumer-rules.pro"
    }

    // 'lintOptions' is deprecated; use 'lint' in AGP 8.x
    lint {
        disable 'InvalidPackage'
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }

    // AGP 8.x requires JDK 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()

    // for your local .aar / jars
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // your original dependencies (moved to the proper top-level block)
    api 'androidx.annotation:annotation:1.1.0'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.orhanobut:logger:1.15'
    implementation files('libs/vpprotocol_2.1.44.15.jar')

    // Lombok: prefer compileOnly + annotationProcessor, but keeping your impl for parity
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    implementation 'org.projectlombok:lombok:1.18.30'

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}