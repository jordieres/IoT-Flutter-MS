name: Signing file protection

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  signing-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files and history
        run: python3 scripts/check_signing_secrets.py --history
